$kind: http-request
description: "Import specific gas lifts by ID. Body: { gasLifts: string[] } —
  array of Gas Lift IDs (min 1 required)."
url: "{{cbdBaseUrl}}/gaslift/import"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "gasLifts": [
        "gas-lift-id-1",
        "gas-lift-id-2"
      ]
    }
order: 3000
