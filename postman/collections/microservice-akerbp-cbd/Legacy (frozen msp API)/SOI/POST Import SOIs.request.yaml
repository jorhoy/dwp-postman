$kind: http-request
description: "Import specific SOIs by ID. Body: { sois: string[] } — array of
  SOI IDs (min 1 required)."
url: "{{cbdBaseUrl}}/soi/import"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sois": [
        "soi-id-1",
        "soi-id-2"
      ]
    }
order: 3000
